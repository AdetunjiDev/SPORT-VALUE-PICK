# =====================================================================
# Netlify configuration for Sporty Value Pick AI.
#
# There is no static site here. Every route is rendered at request time
# by netlify/functions/app.mts, which wraps the same handleRequest() that
# the local node:http listener uses. The `publish` directory exists only
# because Netlify requires one; it holds a single placeholder that is
# never served, since the function claims "/*".
# =====================================================================

[build]
  # We bundle the functions ourselves rather than letting Netlify's bundler
  # do it. Netlify externalises bare imports for ESM functions, so
  # "@sportybet/db" and "@sportybet/shared" were left unresolved and the
  # function crashed at runtime with ERR_MODULE_NOT_FOUND. Those are pnpm
  # workspace packages whose entry point is raw TypeScript (src/index.ts),
  # so they must be compiled in, not linked at runtime.
  #
  # esbuild follows the workspace symlinks, compiles the TS and emits one
  # self-contained .mjs per function into netlify/functions/. Only true
  # natives stay external: @prisma/client ships a platform .node engine,
  # telegram (gramJS) does dynamic requires, and node-tesseract-ocr is
  # absent by design here -- ocr.ts already treats its absence as
  # "image OCR off" rather than an error.
  command = """
    pnpm install --frozen-lockfile && \
    pnpm --filter @sportybet/db generate && \
    npx --yes esbuild@0.24.2 netlify/src/app.mts netlify/src/crawl.mts \
      --bundle --platform=node --format=esm --target=node20 \
      --outdir=netlify/functions --out-extension:.js=.mjs \
      --external:@prisma/client --external:.prisma \
      --external:telegram --external:node-tesseract-ocr \
      --banner:js="import{createRequire as __cr}from'module';const require=__cr(import.meta.url);" && \
    mkdir -p public && echo 'ok' > public/index.html
  """
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

  # ---- Secrets scanning ----
  # Netlify scans build output for the VALUE of every configured env var.
  # Several of ours are ordinary constants, not secrets, and their values
  # occur throughout the source: ALLOW_SIGNUP=1 matches the digit "1" in
  # 59 files, TELEGRAM_MSG_LIMIT=25 in 21, NODE_ENV=production in 5. Those
  # matches are what fail the build, not a leak.
  #
  # Only genuinely non-secret keys are omitted here. Every real credential
  # -- DATABASE_URL, DIRECT_URL, SUPABASE_SERVICE_ROLE_KEY, REDIS_URL,
  # SESSION_SECRET, APP_PASSWORD, ADMIN_KEY, APIFOOTBALL_KEY,
  # BYTEZ_API_KEY, TELEGRAM_API_HASH, TELEGRAM_SESSION -- stays scanned,
  # so an actual leak still breaks the build. Do not add them here.
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,ALLOW_SIGNUP,PUBLIC_BASE_URL,SUPABASE_URL,SUPABASE_ANON_KEY,APIFOOTBALL_PROVIDER,APIFOOTBALL_DAILY_BUDGET,APIFOOTBALL_INTEL_BUDGET,APIFOOTBALL_PREDS_PER_CYCLE,DEFAULT_CRAWL_INTERVAL_SEC,PLAN_DAILY_NGN,PLAN_WEEKLY_NGN,PLAN_MONTHLY_NGN,TELEGRAM_MSG_LIMIT,TELEGRAM_OCR_PER_CHANNEL,TELEGRAM_API_ID"

  # .env.example ships placeholder credentials for local Docker; they are
  # not real and would otherwise trip the scanner.
  SECRETS_SCAN_OMIT_PATHS = ".env.example,README.md,deploy/DEPLOY.md"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Prisma must not be bundled by esbuild -- the engine is a native .node
  # binary that has to be shipped as a real file, not inlined.
  external_node_modules = ["@prisma/client", ".prisma", "telegram"]
  included_files = [
    "node_modules/.prisma/client/**",
    "node_modules/@prisma/client/**",
    "packages/db/prisma/schema.prisma"
  ]

# ---------------------------------------------------------------------
# Routing: hand every path to the app function. force = true is required,
# otherwise Netlify serves the placeholder public/index.html at "/" and
# only falls through to the function on a miss.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
  force = true
